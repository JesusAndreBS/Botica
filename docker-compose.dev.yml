version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nova-postgres-dev
    environment:
      POSTGRES_DB: nova_salud
      POSTGRES_USER: nova_user
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_user -d nova_salud"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nova-network

  redis:
    image: redis:7-alpine
    container_name: nova-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nova-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nova-backend-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://nova_user:dev_password_123@postgres:5432/nova_salud?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production_min_32_chars
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - nova-network
    command: pnpm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nova-frontend-dev
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - nova-network
    command: pnpm run dev

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  nova-network:
    driver: bridge